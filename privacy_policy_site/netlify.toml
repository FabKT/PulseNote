[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), geolocation=(), microphone=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Content-Security-Policy = "default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'none'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self' mailto:"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[redirects]]
  from = "/privacy"
  to = "/index.html"
  status = 302

[[redirects]]
  from = "/confidentialite"
  to = "/index.html"
  status = 302

[[redirects]]
  from = "/delete-account"
  to = "/suppression-compte.html"
  status = 302

[[redirects]]
  from = "/suppression-compte"
  to = "/suppression-compte.html"
  status = 302

[[redirects]]
  from = "/conditions"
  to = "/conditions.html"
  status = 302
