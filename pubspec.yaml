name: audio_recorder
description: Enregistreur audio intelligent avec activation programmée et traitement IA
version: 1.0.0+1
publish_to: 'none'

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Enregistrement audio
  record: ^5.1.2
  audioplayers: ^6.6.0

  # Service foreground Android (garde l'app vivante en arrière-plan)
  flutter_foreground_task: ^8.11.0

  # Stockage local
  shared_preferences: ^2.2.3
  path_provider: ^2.1.4

  # Achats intégrés / abonnements Google Play
  in_app_purchase: ^3.2.0

  # Gestion des permissions (micro, notifications)
  permission_handler: ^11.3.1

  # Gestion d'état réactive
  provider: ^6.1.2

  # Formatage des dates/heures
  intl: ^0.19.0
  http: ^1.2.2
  http_parser: ^4.0.2
  crypto: ^3.0.6
  speech_to_text: ^7.0.0

  cupertino_icons: ^1.0.6
  supabase_flutter: ^2.8.0
  connectivity_plus: ^6.1.0
  # Ouverture des pages legales depuis l'ecran Parametres. Deja tiree par
  # supabase_flutter, mais declaree ici car on l'utilise directement.
  url_launcher: ^6.3.0
  google_sign_in: ^7.2.0
  file_picker: ^11.0.2
  ffmpeg_kit_flutter_new: ^4.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  # Genere les icones de lanceur depuis assets/icon/app_icon.png.
  # Outil de developpement : n'est pas embarque dans l'application.
  flutter_launcher_icons: ^0.14.1

dependency_overrides:
  # record_linux v0.7.2 est incompatible avec record_platform_interface v1.5.0
  # (méthodes startStream et hasPermission manquantes). On force v1.3.0.
  record_linux: ^1.3.0

flutter:
  uses-material-design: true

# Regenerer apres toute modification du logo :
#   dart run flutter_launcher_icons
# Le fond adaptatif est noir car le logo repose deja sur un fond noir : les
# bords se fondent, seul le carre sombre et le micro dore restent visibles
# une fois le masque Android applique.
flutter_launcher_icons:
  android: "ic_launcher"
  ios: false
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 24
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: "assets/icon/app_icon.png"
